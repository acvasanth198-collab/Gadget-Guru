<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Gadget Guru</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- THEME & GLOBAL STYLES --- */
        :root {
            --primary-color: #e74c3c;
            --success-color: #27ae60;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --font-family-headings: 'Roboto', sans-serif;
            --font-family-body: 'Poppins', sans-serif;
            --transition: all 0.3s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-body);
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* --- MAIN CONTAINER & ANIMATION --- */
        .signup-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            padding: 40px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s 0.2s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- HEADER --- */
        .signup-header .icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .signup-header h1 {
            font-family: var(--font-family-headings);
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .signup-header p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* --- FORM STYLES --- */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-family-body);
            background-color: #2a2a2a;
            color: var(--text-primary);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input::placeholder {
            color: #6b7280;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="password"] {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: var(--text-secondary);
            background: transparent;
            border: none;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        /* --- BUTTON --- */
        .submit-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: var(--transition);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.25);
        }

        /* --- MESSAGES & LINKS --- */
        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 5px;
            display: none;
            text-align: left;
        }

        .error {
            color: #f87171;
            background-color: #4c1d1d;
            border: 1px solid #7f1d1d;
        }

        .success {
            color: #4ade80;
            background-color: #164e2a;
            border: 1px solid #166534;
        }

        .links {
            margin-top: 25px;
            font-size: 14px;
        }

        .links p {
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-container">

        <div class="signup-header">
            <div class="icon"><i class="fas fa-user-plus"></i></div>
            <h1>Create Your Account</h1>
            <p>Join Gadget Guru Today!</p>
        </div>

        <form class="signup-form" id="signupForm" method="POST">
            <div id="messageBox" class="message"></div>

            <!-- Initial User Input Fields -->
            <div id="initial-fields">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                        <span class="toggle-password" data-target="password"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm" name="confirm" placeholder="Confirm your password" required>
                        <span class="toggle-password" data-target="confirm"></span>
                    </div>
                </div>
            </div>

            <!-- OTP Field (Initially Hidden) -->
            <div class="form-group" id="otp-group" style="display: none;">
                <label for="otp">Verification Code</label>
                <input type="text" id="otp" name="otp" placeholder="Enter OTP from your email" autocomplete="one-time-code">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Sign Up</button>
        </form>

        <div class="links">
            <p>Already have an account? <a href="login.php">Login</a></p>
            <p style="margin-top: 20px;"><a href="landing.html">Back to Home</a></p>
        </div>

    </div>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function() {
            let isOtpSent = false;

            // --- Form Submission Logic ---
            $('#signupForm').on('submit', function(e) {
                e.preventDefault();
                let messageBox = $('#messageBox');
                messageBox.hide().removeClass('success error');

                // --- STAGE 1: SEND INITIAL DATA ---
                if (!isOtpSent) {
                    $.ajax({
                        url: 'signup-process.php',
                        type: 'POST',
                        data: $(this).serialize(),
                        dataType: 'json',
                        success: function(response) {
                            if (response.status === 'success') {
                                messageBox.text(response.message).addClass('success').show();
                                $('#initial-fields').slideUp();
                                $('#otp-group').slideDown();
                                $('#submitBtn').text('Verify & Create Account');
                                isOtpSent = true;
                            } else {
                                messageBox.text(response.message).addClass('error').show();
                            }
                        },
                        error: function() {
                            messageBox.text('An unknown error occurred. Please try again.').addClass('error').show();
                        }
                    });
                } 
                // --- STAGE 2: VERIFY OTP ---
                else {
                    let email = $('#email').val();
                    let otp = $('#otp').val();
                    $.ajax({
                        url: 'verify-otp.php',
                        type: 'POST',
                        data: {
                            email: email,
                            otp: otp
                        },
                        dataType: 'json',
                        success: function(response) {
                            if (response.status === 'success') {
                                messageBox.text(response.message).addClass('success').show();
                                $('#submitBtn').hide();
                                setTimeout(function() {
                                    window.location.href = 'shome.php'; // Redirect to homepage
                                }, 2000);
                            } else {
                                messageBox.text(response.message).addClass('error').show();
                            }
                        },
                        error: function() {
                            messageBox.text('An error occurred during verification.').addClass('error').show();
                        }
                    });
                }
            });

            // --- Password Toggle Logic ---
            const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`;
            const eyeSlashIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L6.228 6.228" /></svg>`;
            
            $('.toggle-password').each(function() {
                $(this).html(eyeIcon);
                $(this).on('click', function() {
                    let targetId = $(this).data('target');
                    let targetInput = $('#' + targetId);
                    let type = targetInput.attr('type') === 'password' ? 'text' : 'password';
                    targetInput.attr('type', type);
                    $(this).html(type === 'password' ? eyeIcon : eyeSlashIcon);
                });
            });
        });
    </script>

</body>
</html>
